<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>PDF Link Extractor</title>
  <script src="lib/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #1a1a2e;
      background: #f8f9ff;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 14px 11px;
      background: linear-gradient(135deg, #e63946 0%, #c1121f 100%);
      color: #fff;
    }
    .header-icon { width: 26px; height: 26px; flex-shrink: 0; }
    .header-text { min-width: 0; }
    .header-title { font-size: 14px; font-weight: 700; letter-spacing: 0.2px; }
    .header-sub {
      font-size: 11px; opacity: 0.85; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── Main scrollable area ── */
    #content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* ── Loading ── */
    .loading {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #888;
      padding: 32px;
    }
    .spinner {
      width: 22px; height: 22px;
      border: 3px solid #e8e8e8;
      border-top-color: #e63946;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 12px; }

    /* ── Error / Empty ── */
    .error-box {
      margin: 14px;
      padding: 13px 14px;
      background: #fff3f3;
      border: 1px solid #ffc0c0;
      border-radius: 8px;
      color: #c1121f;
      font-size: 12px;
      line-height: 1.6;
    }
    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 6px;
      color: #aaa;
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
      padding: 32px;
    }
    .empty-icon { font-size: 28px; margin-bottom: 4px; }

    /* ── Idle (no PDF) ── */
    .idle {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #aaa;
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
      padding: 32px;
    }
    .idle-icon { font-size: 32px; margin-bottom: 4px; opacity: 0.5; }

    /* ── Summary bar ── */
    .summary {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      background: #fff;
      border-bottom: 1px solid #eaedf5;
    }
    .summary-count { font-weight: 600; font-size: 13px; }
    .summary-count span { color: #e63946; }
    .btn-copy {
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 600;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #e63946;
      color: #fff;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-copy:hover { background: #c1121f; }
    .btn-copy:active { transform: scale(0.97); }
    .btn-copy.copied { background: #2d9e5f; }

    /* ── Filter ── */
    .filter-bar {
      flex-shrink: 0;
      padding: 7px 14px;
      background: #fff;
      border-bottom: 1px solid #eaedf5;
    }
    .filter-input {
      width: 100%;
      padding: 6px 10px;
      font-size: 12px;
      border: 1px solid #d0d5e8;
      border-radius: 6px;
      outline: none;
      background: #f8f9ff;
      color: #1a1a2e;
      transition: border-color 0.15s;
    }
    .filter-input:focus { border-color: #e63946; }

    /* ── Link list ── */
    #link-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }
    #link-list::-webkit-scrollbar { width: 4px; }
    #link-list::-webkit-scrollbar-thumb { background: #d0d5e8; border-radius: 4px; }

    .link-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 14px;
      transition: background 0.12s;
    }
    .link-item:hover { background: #f0f2fc; }
    .page-badge {
      flex-shrink: 0;
      margin-top: 1px;
      padding: 2px 5px;
      background: #eef0fb;
      color: #3a3a6e;
      font-size: 10px;
      font-weight: 700;
      border-radius: 4px;
      white-space: nowrap;
    }
    .link-url {
      flex: 1;
      font-size: 11.5px;
      color: #1a5cad;
      word-break: break-all;
      line-height: 1.45;
      text-decoration: none;
    }
    .link-url:hover { text-decoration: underline; color: #e63946; }
    .copy-one {
      flex-shrink: 0;
      opacity: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      font-size: 13px;
      padding: 2px 3px;
      border-radius: 4px;
      transition: opacity 0.12s, color 0.12s;
    }
    .link-item:hover .copy-one { opacity: 1; }
    .copy-one:hover { color: #e63946; }

    /* ── Footer ── */
    .footer {
      flex-shrink: 0;
      padding: 8px 14px;
      background: #fff;
      border-top: 1px solid #eaedf5;
      font-size: 10px;
      color: #bbb;
      text-align: center;
    }
    .footer a {
      color: #bbb;
      text-decoration: none;
    }
    .footer a:hover { color: #e63946; text-decoration: underline; }
  </style>
</head>
<body>
  <!-- Header（始终可见）-->
  <div class="header">
    <svg class="header-icon" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="26" height="26" rx="6" fill="rgba(255,255,255,0.18)"/>
      <path d="M6 4h8l5 5v12a1 1 0 01-1 1H6a1 1 0 01-1-1V5a1 1 0 011-1z" fill="white" opacity="0.9"/>
      <path d="M14 4l5 5h-4a1 1 0 01-1-1V4z" fill="white" opacity="0.5"/>
      <path d="M8 12h9M8 15h7M8 18h5" stroke="#e63946" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <div class="header-text">
      <div class="header-title">PDF Link Extractor</div>
      <div class="header-sub" id="header-sub">等待 PDF 标签页…</div>
    </div>
  </div>

  <!-- 动态内容区 -->
  <div id="content">
    <div class="idle">
      <div class="idle-icon">📄</div>
      请切换到一个 PDF 标签页<br>链接将自动加载
    </div>
  </div>

  <!-- Footer（始终可见）-->
  <div class="footer">
    <a href="https://github.com/DetectiveAI4869/pdf-skills/tree/main/pdf-link-extractor"
       target="_blank">GitHub · PDF Link Extractor</a>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
