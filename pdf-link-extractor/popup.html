<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Link Extractor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 480px;
      min-height: 120px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #1a1a2e;
      background: #f8f9ff;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      background: linear-gradient(135deg, #e63946 0%, #c1121f 100%);
      color: #fff;
    }

    .header-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .header-sub {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 370px;
    }

    /* ── Status / Loading ── */
    #status {
      padding: 20px 16px;
      text-align: center;
      color: #555;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #e0e0e0;
      border-top-color: #e63946;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 12px;
      color: #666;
    }

    /* ── Error state ── */
    .error-box {
      margin: 12px 16px;
      padding: 12px 14px;
      background: #fff3f3;
      border: 1px solid #ffc0c0;
      border-radius: 8px;
      color: #c1121f;
      font-size: 12px;
      line-height: 1.5;
    }

    /* ── Summary bar ── */
    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid #eaedf5;
    }

    .summary-count {
      font-weight: 600;
      font-size: 13px;
    }

    .summary-count span {
      color: #e63946;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn {
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 600;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-copy {
      background: #e63946;
      color: #fff;
    }

    .btn-copy:hover { background: #c1121f; }

    .btn-copy.copied {
      background: #2d9e5f;
    }

    .btn-export {
      background: #eef0fb;
      color: #3a3a6e;
    }

    .btn-export:hover { background: #dde0f5; }

    /* ── Filter bar ── */
    .filter-bar {
      padding: 8px 16px;
      background: #fff;
      border-bottom: 1px solid #eaedf5;
    }

    .filter-input {
      width: 100%;
      padding: 6px 10px;
      font-size: 12px;
      border: 1px solid #d0d5e8;
      border-radius: 6px;
      outline: none;
      background: #f8f9ff;
      color: #1a1a2e;
      transition: border-color 0.15s;
    }

    .filter-input:focus {
      border-color: #e63946;
    }

    /* ── Link list ── */
    #link-list {
      max-height: 340px;
      overflow-y: auto;
      padding: 8px 0;
    }

    #link-list::-webkit-scrollbar {
      width: 5px;
    }

    #link-list::-webkit-scrollbar-thumb {
      background: #d0d5e8;
      border-radius: 4px;
    }

    .link-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 16px;
      transition: background 0.12s;
      cursor: default;
    }

    .link-item:hover {
      background: #f0f2fc;
    }

    .page-badge {
      flex-shrink: 0;
      margin-top: 1px;
      padding: 2px 6px;
      background: #eef0fb;
      color: #3a3a6e;
      font-size: 10px;
      font-weight: 700;
      border-radius: 4px;
      white-space: nowrap;
    }

    .link-url {
      flex: 1;
      font-size: 12px;
      color: #1a5cad;
      word-break: break-all;
      line-height: 1.45;
      text-decoration: none;
    }

    .link-url:hover {
      text-decoration: underline;
      color: #e63946;
    }

    .copy-one {
      flex-shrink: 0;
      opacity: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: #aaa;
      font-size: 13px;
      padding: 2px 4px;
      border-radius: 4px;
      transition: opacity 0.15s, color 0.15s;
    }

    .link-item:hover .copy-one {
      opacity: 1;
    }

    .copy-one:hover { color: #e63946; }

    /* ── Empty state ── */
    .empty {
      padding: 28px 20px;
      text-align: center;
      color: #999;
      font-size: 12px;
      line-height: 1.7;
    }

    /* ── Footer ── */
    .footer {
      padding: 8px 16px;
      background: #fff;
      border-top: 1px solid #eaedf5;
      font-size: 10px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <svg class="header-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="28" height="28" rx="6" fill="rgba(255,255,255,0.18)"/>
      <path d="M7 5h9l5 5v13a1 1 0 01-1 1H7a1 1 0 01-1-1V6a1 1 0 011-1z" fill="white" opacity="0.9"/>
      <path d="M16 5l5 5h-4a1 1 0 01-1-1V5z" fill="white" opacity="0.5"/>
      <path d="M9 13h10M9 16h7M9 19h5" stroke="#e63946" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="header-title">PDF Link Extractor</div>
      <div class="header-sub" id="header-filename">正在检测页面…</div>
    </div>
  </div>

  <!-- Dynamic content -->
  <div id="content">
    <div id="status">
      <div class="spinner"></div>
      <div class="status-text">正在加载 PDF…</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
